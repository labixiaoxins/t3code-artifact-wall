<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#f4f8fa"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Arial,sans-serif"><text x="48" y="65" font-size="24" fill="#148078" font-weight="650">05</text><text x="110" y="65" font-size="34" fill="#172c3c" font-weight="650">空间管理，从看占用到受控归档</text><text x="110" y="100" font-size="18" fill="#587080" font-weight="400">Storage management · inspect, plan, verify, recover</text><rect x="48" y="160" width="352" height="137" rx="16" fill="#ffffff" stroke="#d9e2e9"/><text x="68" y="194" font-size="22" fill="#148078" font-weight="650">1</text><text x="68" y="233" font-size="25" fill="#172c3c" font-weight="600">检查与下钻</text><text x="68" y="265" font-size="17" fill="#587080" font-weight="400">Inspect &amp; drill down</text><path d="M405 229h12m-5-5 5 5-5 5" fill="none" stroke="#85a4b1" stroke-width="2"/><rect x="424" y="160" width="352" height="137" rx="16" fill="#ffffff" stroke="#d9e2e9"/><text x="444" y="194" font-size="22" fill="#148078" font-weight="650">2</text><text x="444" y="233" font-size="25" fill="#172c3c" font-weight="600">选择外盘和范围</text><text x="444" y="265" font-size="17" fill="#587080" font-weight="400">Select volume &amp; scope</text><path d="M781 229h12m-5-5 5 5-5 5" fill="none" stroke="#85a4b1" stroke-width="2"/><rect x="800" y="160" width="352" height="137" rx="16" fill="#ffffff" stroke="#d9e2e9"/><text x="820" y="194" font-size="22" fill="#148078" font-weight="650">3</text><text x="820" y="233" font-size="25" fill="#172c3c" font-weight="600">预览具体计划</text><text x="820" y="265" font-size="17" fill="#587080" font-weight="400">Preview exact plan</text><rect x="48" y="330" width="352" height="137" rx="16" fill="#ffffff" stroke="#d9e2e9"/><text x="68" y="364" font-size="22" fill="#148078" font-weight="650">4</text><text x="68" y="403" font-size="25" fill="#172c3c" font-weight="600">归档并校验</text><text x="68" y="435" font-size="17" fill="#587080" font-weight="400">Archive &amp; verify</text><path d="M405 399h12m-5-5 5 5-5 5" fill="none" stroke="#85a4b1" stroke-width="2"/><rect x="424" y="330" width="352" height="137" rx="16" fill="#ffffff" stroke="#d9e2e9"/><text x="444" y="364" font-size="22" fill="#148078" font-weight="650">5</text><text x="444" y="403" font-size="25" fill="#172c3c" font-weight="600">批准范围内释放</text><text x="444" y="435" font-size="17" fill="#587080" font-weight="400">Release approved source</text><path d="M781 399h12m-5-5 5 5-5 5" fill="none" stroke="#85a4b1" stroke-width="2"/><rect x="800" y="330" width="352" height="137" rx="16" fill="#ffffff" stroke="#d9e2e9"/><text x="820" y="364" font-size="22" fill="#148078" font-weight="650">6</text><text x="820" y="403" font-size="25" fill="#172c3c" font-weight="600">恢复到新目录</text><text x="820" y="435" font-size="17" fill="#587080" font-weight="400">Restore to a new folder</text><rect x="48" y="515" width="1104" height="83" rx="12" fill="#e7f3ef" stroke="#cfe5dd"/><text x="72" y="548" font-size="23" fill="#246455" font-weight="600">引用不明、文件变化、校验失败或外盘掉线：保留原件，停止释放。</text><text x="72" y="578" font-size="17" fill="#407462" font-weight="400">Unknown references, changed sources, failed verification or an offline drive keep sources protected.</text><text x="48" y="658" font-size="19" fill="#3e5969" font-weight="400">流程示意；只归档不会释放源占用。目录统计值不等于实际可释放空间。</text><text x="48" y="689" font-size="16" fill="#637b88" font-weight="400">Flow illustration. Archive-only keeps the source; reported bytes are not guaranteed reclaimable space.</text></g></svg>