<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#f4f8fa"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Arial,sans-serif"><text x="48" y="65" font-size="24" fill="#148078" font-weight="650">07</text><text x="110" y="65" font-size="34" fill="#172c3c" font-weight="650">会审有明确入口，也有明确结果边界</text><text x="110" y="100" font-size="18" fill="#587080" font-weight="400">Review requests with explicit evidence boundaries</text><rect x="48" y="175" width="344" height="142" rx="16" fill="#ffffff" stroke="#d9e2e9"/><text x="72" y="230" font-size="26" fill="#172c3c" font-weight="600">点击“会审”</text><text x="72" y="271" font-size="19" fill="#587080" font-weight="400">Request a review</text><path d="M398 245h22m-6-6 6 6-6 6" stroke="#85a4b1" fill="none" stroke-width="2"/><rect x="428" y="175" width="344" height="142" rx="16" fill="#ffffff" stroke="#d9e2e9"/><text x="452" y="230" font-size="26" fill="#172c3c" font-weight="600">当前助手实际派发</text><text x="452" y="271" font-size="19" fill="#587080" font-weight="400">Assistant dispatches</text><path d="M778 245h22m-6-6 6 6-6 6" stroke="#85a4b1" fill="none" stroke-width="2"/><rect x="808" y="175" width="344" height="142" rx="16" fill="#ffffff" stroke="#d9e2e9"/><text x="832" y="230" font-size="26" fill="#172c3c" font-weight="600">返回并汇总意见</text><text x="832" y="271" font-size="19" fill="#587080" font-weight="400">Collect real results</text><rect x="48" y="350" width="1104" height="210" rx="16" fill="#fff" stroke="#d9e2e9"/><text x="80" y="398" font-size="26" fill="#172c3c" font-weight="600">GPT / Gemini / Grok：以实际可用通道、调用和回执为准。</text><text x="80" y="447" font-size="23" fill="#172c3c" font-weight="400">按钮发送会审请求，不会仅凭预设名自动启动三个模型。</text><text x="80" y="490" font-size="23" fill="#172c3c" font-weight="400">分别写明共识、分歧与缺席；完成数量不等于同意数量。</text><text x="80" y="530" font-size="18" fill="#587080" font-weight="400">Available providers, actual dispatch and returned results determine review completeness.</text><text x="48" y="658" font-size="19" fill="#3e5969" font-weight="400">行为示意；不承诺任意账号都具备三个通道，不自动提高权限或改变当前模型。</text><text x="48" y="689" font-size="16" fill="#637b88" font-weight="400">Behavior illustration. No automatic permission escalation, model switch, or claim of unanimous approval.</text></g></svg>