<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#f4f8fa"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Arial,sans-serif"><text x="48" y="65" font-size="24" fill="#148078" font-weight="650">08</text><text x="110" y="65" font-size="34" fill="#172c3c" font-weight="650">从 C13 到 C23，累计升级</text><text x="110" y="100" font-size="18" fill="#587080" font-weight="400">Cumulative upgrade · more than a composer refresh</text><rect x="48" y="145" width="1104" height="78" rx="16" fill="#e7f3ef" stroke="#cfe5dd"/><text x="74" y="192" font-size="29" fill="#246455" font-weight="650">C13 · 官方 0.1.1  →  C23 · 完整官方 0.1.3</text><rect x="48" y="245" width="540" height="94" rx="16" fill="#ffffff" stroke="#d9e2e9"/><text x="68" y="278" font-size="22" fill="#148078" font-weight="600">内核与恢复 / Core &amp; recovery</text><text x="68" y="313" font-size="24" fill="#172c3c" font-weight="400">完整上游基线与适用修复</text><rect x="612" y="245" width="540" height="94" rx="16" fill="#ffffff" stroke="#d9e2e9"/><text x="632" y="278" font-size="22" fill="#148078" font-weight="600">本机检索 / Local search</text><text x="632" y="313" font-size="24" fill="#172c3c" font-weight="400">全文索引、命中与会话定位</text><rect x="48" y="357" width="540" height="94" rx="16" fill="#ffffff" stroke="#d9e2e9"/><text x="68" y="390" font-size="22" fill="#148078" font-weight="600">额度保护 / Quota safeguards</text><text x="68" y="425" font-size="24" fill="#172c3c" font-weight="400">可选 Claude 保护与启动协调</text><rect x="612" y="357" width="540" height="94" rx="16" fill="#ffffff" stroke="#d9e2e9"/><text x="632" y="390" font-size="22" fill="#148078" font-weight="600">运行详情 / Run inspector</text><text x="632" y="425" font-size="24" fill="#172c3c" font-weight="400">实际模型、推理、账号与子任务</text><rect x="48" y="469" width="540" height="94" rx="16" fill="#ffffff" stroke="#d9e2e9"/><text x="68" y="502" font-size="22" fill="#148078" font-weight="600">存储治理 / Storage operations</text><text x="68" y="537" font-size="24" fill="#172c3c" font-weight="400">检查、归档、校验、释放与恢复</text><rect x="612" y="469" width="540" height="94" rx="16" fill="#ffffff" stroke="#d9e2e9"/><text x="632" y="502" font-size="22" fill="#148078" font-weight="600">交互收敛 / Refined interaction</text><text x="632" y="537" font-size="24" fill="#172c3c" font-weight="400">图标侧栏、模型精简、三行半</text><text x="48" y="658" font-size="19" fill="#3e5969" font-weight="400">项目分组、产物、视频、续聊和额度常显继续保留；图为累计能力示意。</text><text x="48" y="689" font-size="16" fill="#637b88" font-weight="400">Existing project grouping, artifacts, video, continuity and quota display are retained.</text></g></svg>